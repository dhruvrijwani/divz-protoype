<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House of Zariva prototype</title>
<link rel="icon" href="site/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="shell/shell.css">
</head>
<body>
<!-- Presentation shell. Client copy does not belong here: it lives in shell/data.js. -->
<div class="app">
  <header class="bar">
    <div class="bar__brand" id="brand"></div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </header>

  <div class="tools" id="tools">
    <div class="seg" id="seg-device" role="group" aria-label="Device"><button type="button" data-device="mobile">Mobile</button><button type="button" data-device="desktop">Desktop</button></div>
    <div class="seg" id="seg-view" role="group" aria-label="View"><button type="button" data-view="new">New</button><button type="button" data-view="old">Today</button><button type="button" data-view="both">Side by side</button></div>
    <div class="seg" id="seg-sub" role="group" aria-label="Variant" hidden></div>
    <div class="seg seg--date" id="seg-date" role="group" aria-label="Pretend today is" hidden></div>
    <label class="switch switch--festive" id="festive-switch" hidden><input type="checkbox" id="sw-festive"><span id="festive-label">Christmas</span></label>
    <label class="switch"><input type="checkbox" id="sw-notes">Notes</label>
    <label class="switch"><input type="checkbox" id="sw-build">Build labels</label>
    <span class="legend" id="legend"></span>
    <div class="tools__right"><a class="tools__link" id="open-new" href="#" target="_blank" rel="noopener">Open this page on its own</a></div>
  </div>

  <div class="main" id="main">
    <div class="stage" id="stage"></div>
    <aside class="notes" id="notes" aria-label="Notes">
      <div class="notes__head"><h2 id="notes-title">What it is, and why</h2><p id="notes-sub"></p></div>
      <ol class="notes__list" id="notes-list"></ol>
    </aside>
  </div>
</div>

<script src="shell/data.js"></script>
<script src="shell/shell.js"></script>
</body>
</html>
