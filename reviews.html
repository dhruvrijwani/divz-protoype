<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reviews | DIVZ</title>
<meta name="description" content="Read 1,284 verified reviews of DIVZ hampers from customers across Australia.">
<meta name="theme-color" content="#1E3B2F">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/gambetta-300.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/switzer-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/divz.css">
<script src="assets/js/data.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/pages.js"></script>
</head>
<body data-page="reviews">
<script>DIVZ.top()</script>

<main id="main">

  <section class="container page-hero">
    <h1 class="t-h1">Kind words, from real orders.</h1>
    <p class="t-lead">Every review here is matched to an order. We publish them all, including the ones that tell us where we can do better.</p>
  </section>
  <section class="container">
    <div class="rev-summary" data-rev-summary></div>
  </section>
  <section class="section section--tight" aria-labelledby="photos-h">
    <div class="container">
      <div class="section-head"><div class="section-head__text"><h2 class="t-h3" id="photos-h">Photos from customers</h2></div></div>
      <div class="photo-strip" data-photo-strip></div>
    </div>
  </section>
  <section class="container" style="padding-bottom:var(--section)" aria-labelledby="all-h">
    <h2 class="visually-hidden" id="all-h">All reviews</h2>
    <div class="rev-filters" data-rev-filters></div>
    <p class="t-meta" style="padding-top:16px" data-rev-count aria-live="polite"></p>
    <div class="rev-list" data-rev-list></div>
    <div data-rev-more></div>
  </section>
</main>

<script>DIVZ.bottom()</script>
<script>DIVZ.boot()</script>
</body>
</html>
